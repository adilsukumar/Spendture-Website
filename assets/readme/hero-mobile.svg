<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1175" viewBox="0 0 640 1175" role="img" aria-labelledby="t d"><title id="t">Spendture pre-launch website. A product story, interactive waitlist and launch experience. Concept page artwork, not actual signup data.</title><desc id="d">Spendture pre-launch website. A product story, interactive waitlist and launch experience. Concept page artwork, not actual signup data. Conceptual launch-page illustration, not a finished finance product or measured signup data.</desc><style>@keyframes launch{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.launch{animation:launch 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.launch,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="53" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#BCFCF6" font-weight="600" >SPENDTURE / THE PRE-LAUNCH WEBSITE</text><text x="24" y="232" font-family="Bahnschrift, Arial, sans-serif" font-size="105" fill="#F8F8F3" font-weight="700" letter-spacing="-5">Spendture</text><text x="32" y="338" font-family="Bahnschrift, Arial, sans-serif" font-size="65" fill="#FF4081" font-weight="600" >An idea,</text><text x="32" y="405" font-family="Bahnschrift, Arial, sans-serif" font-size="43" fill="#FF4081" font-weight="600" >ready to meet people.</text><text x="32" y="481" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >A product story, an interactive</text><text x="32" y="515" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >waitlist and the first step toward</text><text x="32" y="549" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >launch.</text><g transform="translate(150 708) scale(1.1)"><g class="launch"><rect x="0" y="0" width="305" height="315" rx="18" fill="#141320" stroke="#343044"/><path d="M0 34H305" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="17" cy="17" r="4" fill="#FF4081"/><circle cx="33" cy="17" r="4" fill="#F3D962"/><circle cx="49" cy="17" r="4" fill="#BCFCF6"/><g transform="translate(131 55) scale(0.9545454545454546)"><path d="M7 39l8-8M3 32l9-3M15 42l3-11M12 24C16 7 29 1 41 3c2 12-4 25-21 29zM27 11a5 5 0 1 0 0 10a5 5 0 1 0 0-10" fill="none" stroke="#F3D962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="152" y="132" font-family="Bahnschrift, Arial, sans-serif" font-size="30" fill="#F8F8F3" font-weight="700" text-anchor="middle">SPENDTURE</text><text x="152" y="162" font-family="Bahnschrift, Arial, sans-serif" font-size="17" fill="#A783F7" font-weight="600" text-anchor="middle">THE NEXT CHAPTER</text><rect x="24" y="192" width="257" height="41" rx="8" fill="#262036" stroke="#BCFCF6"/><text x="40" y="218" font-family="Bahnschrift, Arial, sans-serif" font-size="17" fill="#BCFCF6" font-weight="400" >Your email</text><rect x="24" y="249" width="257" height="42" rx="8" fill="#FF4081"/><text x="152" y="276" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#0E1116" font-weight="700" text-anchor="middle">JOIN THE WAITLIST</text></g></g><text x="32" y="1134" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >REACT / MOTION / GOOGLE SHEETS</text></svg>