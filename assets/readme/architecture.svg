<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="t d"><title id="t">REACT FRONTEND. React Router connects pre-launch, confirmation and admin screens.; SERVER OPTIONS. Vercel API handlers and a separate Express development backend.; EXTERNAL SERVICES. Google Sheets plus optional Supabase-backed count and feed components.</title><desc id="d">REACT FRONTEND. React Router connects pre-launch, confirmation and admin screens.; SERVER OPTIONS. Vercel API handlers and a separate Express development backend.; EXTERNAL SERVICES. Google Sheets plus optional Supabase-backed count and feed components. Conceptual launch-page illustration, not a finished finance product or measured signup data.</desc><style>@keyframes launch{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.launch{animation:launch 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.launch,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >REACT FRONTEND</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >React Router connects pre-launch,</text><text x="48" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >confirmation and admin screens.</text><rect x="574" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(596 34) scale(0.9090909090909091)"><path d="M4 7h36v27H4zM22 34v8M13 42h18" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >SERVER OPTIONS</text><text x="598" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Vercel API handlers and a separate</text><text x="598" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Express development backend.</text><rect x="24" y="287" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 309) scale(0.9090909090909091)"><path d="M7 3h29v38H7zM7 14h29M7 25h29M18 3v38" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="338" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >EXTERNAL SERVICES</text><text x="48" y="397" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Google Sheets plus optional</text><text x="48" y="431" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Supabase-backed count and feed</text><text x="48" y="465" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >components.</text></svg>